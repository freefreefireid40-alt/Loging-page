<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Login & Signup</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: #242526;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 20px;
        }
        .form-title {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* আধুনিক এরর মেসেজ বক্সের স্টাইল */
        .error-banner {
            background-color: #3e2723;
            color: #ff8a80;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            border-left: 4px solid #f44336;
            display: none;
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #b0b3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #3a3b3c;
            border: 1px solid #393a3b;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #2d88ff;
            outline: none;
        }
        .btn {
            width: 100%;
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #1a6fd8;
        }
        .switch-text {
            margin-top: 20px;
            font-size: 14px;
            color: #b0b3b8;
            cursor: pointer;
        }
        .switch-text span {
            color: #2d88ff;
            font-weight: bold;
        }
        .switch-text span:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">SocialVibe</div>
        <div id="form-title" class="form-title">Sign In</div>

        <!-- আধুনিক নোটিফিকেশন বক্স -->
        <div id="error-message" class="error-banner"></div>

        <form id="auth-form">
            <div class="input-group" id="name-group" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="Enter username or email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="submit-btn">Sign In</button>
        </form>

        <div class="switch-text" onclick="toggleForm()">
            <p id="toggle-msg">Don't have an account? <span>Sign Up</span></p>
        </div>
    </div>

    <script>
        let isSignup = false;

        // মডার্ন নোটিফিকেশন দেখানোর ফাংশন
        function showError(message) {
            const errorBox = document.getElementById("error-message");
            errorBox.innerText = message;
            errorBox.style.display = "block";
            
            // ৪ সেকেন্ড পর নিজে থেকে লুকিয়ে যাবে
            setTimeout(() => {
                errorBox.style.display = "none";
            }, 4000);
        }

        function toggleForm() {
            isSignup = !isSignup;
            document.getElementById("form-title").innerText = isSignup ? "Create Account" : "Sign In";
            document.getElementById("submit-btn").innerText = isSignup ? "Sign Up" : "Sign In";
            document.getElementById("name-group").style.display = isSignup ? "block" : "none";
            document.getElementById("toggle-msg").innerHTML = isSignup ? 
                "Already have an account? <span>Sign In</span>" : 
                "Don't have an account? <span>Sign Up</span>";
            document.getElementById("error-message").style.display = "none";
        }

        document.getElementById("auth-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            let users = JSON.parse(localStorage.getItem("allUsers")) || [];

            if (isSignup) {
                const fullname = document.getElementById("fullname").value.trim();
                if (!fullname) {
                    showError("দয়া করে আপনার পুরো নাম লিখুন!");
                    return;
                }

                const existingUser = users.find(u => u.username === username);
                if (existingUser) {
                    showError("এই ইউজারনেম দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে!");
                    return;
                }

                const newUser = {
                    fullname: fullname,
                    username: username,
                    password: password,
                    bio: "Hey there! I am using this app.",
                    isBlocked: false
                };

                users.push(newUser);
                localStorage.setItem("allUsers", JSON.stringify(users));
                localStorage.setItem("currentUser", username);
                window.location.href = "home.html";
            } else {
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    if (user.isBlocked) {
                        showError("আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!");
                        return;
                    }
                    localStorage.setItem("currentUser", username);
                    window.location.href = "home.html";
                } else {
                    showError("ভুল ইউজারনেম বা পাসওয়ার্ড!");
                }
            }
        });
    </script>
</body>
</html>
