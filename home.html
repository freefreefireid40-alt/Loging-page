<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Home Feed</title>
    <!-- Firebase App & Firestore CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
        }
        .navbar {
            background-color: #242526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover {
            background-color: #4e4f50;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .create-post {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .create-post textarea {
            width: 100%;
            background: #3a3b3c;
            border: none;
            border-radius: 6px;
            color: white;
            padding: 12px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        .create-post button {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            margin-top: 10px;
        }
        .create-post button:hover {
            background-color: #1a6fd8;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #393a3b;
            padding-bottom: 8px;
        }
        .post-actions {
            display: flex;
            justify-content: space-around;
            padding: 5px 0;
            border-bottom: 1px solid #393a3b;
            margin-bottom: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #b0b3b8;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .action-btn:hover {
            color: #2d88ff;
        }
        .comments-section {
            margin-top: 10px;
        }
        .comment-box {
            font-size: 13px;
            background: #3a3b3c;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .comment-input-container {
            display: flex;
            margin-top: 8px;
            gap: 5px;
        }
        .comment-input {
            flex: 1;
            background: #3a3b3c;
            border: none;
            border-radius: 4px;
            color: white;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }
        .comment-btn {
            background: #2d88ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .feed-section {
            background: #242526;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #b0b3b8;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo" onclick="window.location.reload()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToProfile()">Profile</button>
            <button class="nav-btn" onclick="logout()" style="background-color: #d32f2f;">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="create-post clearfix">
            <textarea id="post-text" rows="3" placeholder="What's on your mind?"></textarea>
            <button onclick="createPost()">Post</button>
        </div>

        <div id="posts-container">
            <div class="feed-section">Loading posts...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.firebasestorage.app",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadPostsRealtime();
        };

        function goToProfile() {
            window.location.href = "profile.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function createPost() {
            const content = document.getElementById("post-text").value.trim();
            if (!content) {
                alert("দয়া করে কিছু লিখে তারপর পোস্ট করুন!");
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleDateString() + " at " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.collection("posts").add({
                author: currentUser,
                content: content,
                createdAt: timeString,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                likes: [],
                comments: []
            })
            .then(() => {
                document.getElementById("post-text").value = "";
            })
            .catch((error) => {
                alert("পোস্ট করতে সমস্যা হয়েছে: " + error.message);
            });
        }

        function loadPostsRealtime() {
            const container = document.getElementById("posts-container");

            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <h3>Welcome to SocialVibe!</h3>
                            <p>আপনার পেজে এই মুহূর্তে কোনো পোস্ট নেই। উপরের বক্সে কিছু লিখে আপনার প্রথম পোস্টটি শেয়ার করুন!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let postId = doc.id;
                    
                    let deleteBtn = "";
                    if (post.author === currentUser) {
                        let safePostId = "'" + postId + "'";
                        deleteBtn = `<button onclick="deletePost(${safePostId})" style="background:none; border:none; color:#f44336; float:right; cursor:pointer; font-weight:bold;">Delete</button>`;
                    }

                    // Likes handling
                    let likes = post.likes || [];
                    let isLiked = likes.includes(currentUser);
                    let likeBtnColor = isLiked ? "#2d88ff" : "#b0b3b8";
                    let likeText = isLiked ? "Liked (" + likes.length + ")" : "Like (" + likes.length + ")";

                    // Comments handling
                    let comments = post.comments || [];
                    let commentsHtml = "";
                    comments.forEach(c => {
                        commentsHtml += `<div class="comment-box"><b>@${c.user}:</b> ${c.text}</div>`;
                    });

                    let safeId = "'" + postId + "'";

                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author || 'Anonymous'} ${deleteBtn}</div>
                            <div class="post-content">${post.content}</div>
                            <div class="post-time">${post.createdAt || ''}</div>
                            
                            <div class="post-actions">
                                <button class="action-btn" style="color: ${likeBtnColor};" onclick="toggleLike(${safeId})">👍 ${likeText}</button>
                                <button class="action-btn">💬 Comments (${comments.length})</button>
                            </div>

                            <div class="comments-section">
                                ${commentsHtml}
                                <div class="comment-input-container">
                                    <input type="text" id="comment-input-${postId}" class="comment-input" placeholder="Write a comment...">
                                    <button class="comment-btn" onclick="addComment(${safeId})">Send</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function toggleLike(postId) {
            const postRef = db.collection("posts").doc(postId);
            db.runTransaction((transaction) => {
                return transaction.get(postRef).then((doc) => {
                    if (!doc.exists) throw "Post does not exist!";
                    let postData = doc.data();
                    let likes = postData.likes || [];
                    
                    if (likes.includes(currentUser)) {
                        likes = likes.filter(user => user !== currentUser);
                    } else {
                        likes.push(currentUser);
                    }
                    transaction.update(postRef, { likes: likes });
                });
            }).catch((error) => {
                console.log("Like error: ", error);
            });
        }

        function addComment(postId) {
            const inputField = document.getElementById(`comment-input-${postId}`);
            const commentText = inputField.value.trim();
            if (!commentText) return;

            const postRef = db.collection("posts").doc(postId);
            db.runTransaction((transaction) => {
                return transaction.get(postRef).then((doc) => {
                    if (!doc.exists) throw "Post does not exist!";
                    let postData = doc.data();
                    let comments = postData.comments || [];
                    
                    comments.push({
                        user: currentUser,
                        text: commentText
                    });

                    transaction.update(postRef, { comments: comments });
                });
            }).then(() => {
                inputField.value = "";
            }).catch((error) => {
                console.log("Comment error: ", error);
            });
        }

        function deletePost(postId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                db.collection("posts").doc(postId).delete().catch((error) => {
                    alert("পোস্ট ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
