<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Profile</title>
    <!-- Firebase App & Firestore CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
        }
        /* Top Navigation Bar */
        .navbar {
            background-color: #242526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .nav-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover {
            background-color: #4e4f50;
        }

        /* Profile Header Section */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .profile-header {
            background: #242526;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            background-color: #2d88ff;
            color: white;
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-username {
            font-size: 14px;
            color: #b0b3b8;
            margin-bottom: 15px;
        }

        /* Post Card Style */
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #b0b3b8;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="nav-logo" onclick="goToHome()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToHome()">Home Feed</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Profile Info -->
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-letter">U</div>
            <div class="profile-name" id="user-fullname">Loading...</div>
            <div class="profile-username" id="user-handle">@username</div>
        </div>

        <div class="section-title">My Posts</div>

        <!-- User Posts Container -->
        <div id="user-posts-container">
            <div style="background: #242526; padding: 20px; text-align: center; border-radius: 8px;">Loading your posts...</div>
        </div>

    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.firebasestorage.app",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // লগইন চেক করা
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadUserProfile();
            loadUserPosts();
        };

        function goToHome() {
            window.location.href = "home.html";
        }

        // ইউজারের তথ্য লোড করা
        function loadUserProfile() {
            document.getElementById("user-handle").innerText = "@" + currentUser;
            
            let users = JSON.parse(localStorage.getItem("allUsers")) || [];
            let foundUser = users.find(u => u.username === currentUser);
            
            if (foundUser) {
                document.getElementById("user-fullname").innerText = foundUser.fullname;
                document.getElementById("avatar-letter").innerText = foundUser.fullname.charAt(0).toUpperCase();
            } else {
                document.getElementById("user-fullname").innerText = currentUser;
                document.getElementById("avatar-letter").innerText = currentUser.charAt(0).toUpperCase();
            }
        }

        // শুধু এই ইউজারের পোস্টগুলো ফায়ারবেস থেকে ফিল্টার করে আনা
        function loadUserPosts() {
            const container = document.getElementById("user-posts-container");

            db.collection("posts")
              .where("author", "==", currentUser)
              .orderBy("timestamp", "desc")
              .onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div style="background: #242526; padding: 20px; text-align: center; border-radius: 8px; color: #b0b3b8;">
                            আপনি এখনও কোনো পোস্ট করেননি।
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author}</div>
                            <div class="post-content">${post.content}</div>
                            <div class="post-time">${post.createdAt || ''}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }
    </script>
</body>
</html>
