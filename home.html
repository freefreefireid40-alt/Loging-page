<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Home Feed</title>
    <meta name="manifest" href="manifest.json">
    <!-- Google Fonts Inter for Professional Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e4e6eb;
        }
        /* Top Navigation Bar */
        .navbar {
            background-color: #1f2023;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f3136;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            color: #2d88ff;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-icon-btn {
            background-color: #2d2f36;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
        .nav-icon-btn:hover {
            background-color: #3a3b40;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 70px;
        }

        /* Stories Section */
        .stories-container {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background-color: #121212;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar {
            display: none;
        }
        .story-card {
            min-width: 110px;
            height: 190px;
            border-radius: 12px;
            background: #1f2023;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #2f3136;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            background-size: cover;
            background-position: center;
        }
        .story-card.create-story {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #1f2023;
        }
        .create-story-icon {
            width: 40px;
            height: 40px;
            background-color: #2d88ff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            border: 3px solid #121212;
        }
        .create-story-text {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }
        .story-user-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            z-index: 2;
        }
        .story-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }

        /* Create Post Box */
        .create-post-box {
            background-color: #1f2023;
            margin: 10px 16px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2f3136;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .post-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2d88ff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }
        .post-textarea {
            width: 100%;
            background-color: #2d2f36;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            font-size: 15px;
            resize: none;
            outline: none;
        }
        .post-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2f3136;
            padding-top: 10px;
        }
        .upload-label {
            background-color: #2d2f36;
            color: #e4e6eb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-label:hover {
            background-color: #3a3b40;
        }
        .post-submit-btn {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .post-submit-btn:hover {
            background-color: #1a75ff;
        }
        #file-name-display {
            font-size: 12px;
            color: #b0b3b8;
            margin-left: 8px;
        }

        /* Feed Section / Posts */
        .feed-container {
            padding: 0 16px;
        }
        .post-card {
            background-color: #1f2023;
            border-radius: 12px;
            border: 1px solid #2f3136;
            margin-bottom: 12px;
            padding: 14px;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .post-author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-author-name {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
        }
        .post-time-text {
            font-size: 11px;
            color: #8a8d91;
        }
        .post-body-text {
            font-size: 15px;
            line-height: 1.5;
            color: #e4e6eb;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .post-media-box {
            border-radius: 8px;
            overflow: hidden;
            background-color: #121212;
            margin-bottom: 10px;
            position: relative;
        }
        .post-media-content {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }
        .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .empty-feed {
            background-color: #1f2023;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            color: #8a8d91;
            border: 1px solid #2f3136;
            margin-top: 10px;
        }

        /* Bottom Facebook Style Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: #1f2023;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #2f3136;
            padding: 8px 0;
            z-index: 1000;
        }
        .bottom-nav-item {
            color: #8a8d91;
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
            text-align: center;
        }
        .bottom-nav-item.active {
            color: #2d88ff;
        }
        .bottom-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0; width: 100%;
            height: 3px;
            background-color: #2d88ff;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="navbar">
        <div class="nav-logo" onclick="location.reload()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-icon-btn" onclick="goToProfile()" title="Profile">👤</button>
            <button class="nav-icon-btn" onclick="logout()" title="Logout" style="background-color: #a82222;">🚪</button>
        </div>
    </div>

    <div class="container">
        <!-- Stories Row -->
        <div class="stories-container">
            <div class="story-card create-story" onclick="alert('স্টোরি আপলোড অপশন খুব শীঘ্রই যুক্ত করা হবে!')">
                <div class="create-story-icon">+</div>
                <div class="create-story-text">Create Story</div>
            </div>
            <div class="story-card" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300');">
                <div class="story-overlay"></div>
                <div class="story-user-name">Tanvir Ahmed</div>
            </div>
            <div class="story-card" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=300');">
                <div class="story-overlay"></div>
                <div class="story-user-name">Sumaiya Akter</div>
            </div>
        </div>

        <!-- Create Post Section -->
        <div class="create-post-box">
            <div class="post-input-row">
                <div id="user-initial" class="user-avatar-small">U</div>
                <textarea id="post-text" class="post-textarea" rows="2" placeholder="What's on your mind?"></textarea>
            </div>
            <div class="post-actions-row">
                <div style="display: flex; align-items: center; overflow: hidden;">
                    <label class="upload-label">
                        📷 Photo/Video
                        <input type="file" id="media-file" accept="image/*,video/*" style="display: none;" onchange="showFileName()">
                    </label>
                    <span id="file-name-display">No file chosen</span>
                </div>
                <button class="post-submit-btn" onclick="createPost()">Post</button>
            </div>
        </div>

        <!-- Dynamic Feed Container -->
        <div class="feed-container" id="feed-container">
            <div class="empty-feed">
                <p>কনটেন্ট লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar (No Coming Soon, Clean UI) -->
    <div class="bottom-nav">
        <a href="home.html" class="bottom-nav-item active" title="Home">🏠</a>
        <a href="videos.html" class="bottom-nav-item" title="Videos">▶️</a>
        <a href="friends.html" class="bottom-nav-item" title="Friends">👥</a>
        <a href="notifications.html" class="bottom-nav-item" title="Notifications">🔔</a>
        <a href="menu.html" class="bottom-nav-item" title="Menu">☰</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.appspot.com",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        document.getElementById("user-initial").textContent = currentUser.charAt(0).toUpperCase();

        window.onload = function() {
            loadFeedPosts();
        };

        function goToProfile() {
            window.location.href = "profile.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function showFileName() {
            const fileInput = document.getElementById("media-file");
            const fileNameDisplay = document.getElementById("file-name-display");
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = fileInput.files[0].name;
            } else {
                fileNameDisplay.textContent = "No file chosen";
            }
        }

        function createPost() {
            const text = document.getElementById("post-text").value.trim();
            const fileInput = document.getElementById("media-file");
            const file = fileInput.files[0];

            if (!text && !file) {
                alert("দয়া করে কিছু লিখুন অথবা ছবি/ভিডিও যুক্ত করুন!");
                return;
            }

            const btn = document.querySelector(".post-submit-btn");
            btn.textContent = "Posting...";
            btn.disabled = true;

            const now = new Date();
            const timeString = now.toLocaleDateString() + " at " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (file) {
                const storageRef = storage.ref().child('posts/' + Date.now() + '_' + file.name);
                const uploadTask = storageRef.put(file);

                uploadTask.on('state_changed', null, (error) => {
                    alert("আপলোড ব্যর্থ হয়েছে: " + error.message);
                    btn.textContent = "Post";
                    btn.disabled = false;
                }, () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        let mediaType = file.type.startsWith('video') ? 'video' : 'image';
                        savePostToFirestore(text, downloadURL, mediaType, timeString);
                    });
                });
            } else {
                savePostToFirestore(text, "", "", timeString);
            }
        }

        function savePostToFirestore(content, mediaUrl, mediaType, createdAt) {
            db.collection("posts").add({
                author: currentUser,
                content: content,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                createdAt: createdAt,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById("post-text").value = "";
                document.getElementById("media-file").value = "";
                document.getElementById("file-name-display").textContent = "No file chosen";
                const btn = document.querySelector(".post-submit-btn");
                btn.textContent = "Post";
                btn.disabled = false;
            }).catch((error) => {
                alert("পোস্ট করতে সমস্যা হয়েছে: " + error.message);
                const btn = document.querySelector(".post-submit-btn");
                btn.textContent = "Post";
                btn.disabled = false;
            });
        }

        function loadFeedPosts() {
            const container = document.getElementById("feed-container");

            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-feed">
                            <h3 style="color:#ffffff; margin-bottom: 6px;">Welcome to SocialVibe!</h3>
                            <p>আপনার পেজে এই মুহূর্তে কোনো পোস্ট নেই। উপরের বক্স থেকে আপনার স্ট্যাটাস বা কনটেন্ট শেয়ার করুন!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let authorInitial = post.author ? post.author.charAt(0).toUpperCase() : "U";

                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        let fileExt = post.mediaType === 'video' ? 'mp4' : 'jpg';
                        let fileName = `SocialVibe_${Date.now()}.${fileExt}`;

                        if (post.mediaType === 'video') {
                            mediaHtml = `
                                <div class="post-media-box">
                                    <video src="${post.mediaUrl}" class="post-media-content" controls></video>
                                    <button class="download-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save</button>
                                </div>`;
                        } else {
                            mediaHtml = `
                                <div class="post-media-box">
                                    <img src="${post.mediaUrl}" alt="Post Media" class="post-media-content">
                                    <button class="download-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save</button>
                                </div>`;
                        }
                    }

                    html += `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="post-author-info">
                                    <div class="user-avatar-small" style="width:36px; height:36px; font-size:14px;">${authorInitial}</div>
                                    <div>
                                        <div class="post-author-name">@${post.author}</div>
                                        <div class="post-time-text">${post.createdAt || ''}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="post-body-text">${post.content}</div>
                            ${mediaHtml}
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function downloadFile(fileUrl, fileName) {
            fetch(fileUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    window.open(fileUrl, '_blank');
                });
        }
    </script>
</body>
</html>
