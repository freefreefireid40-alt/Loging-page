<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Home</title>
    <meta name="manifest" href="manifest.json">
    <!-- Firebase App & Firestore & Storage CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
            padding-bottom: 60px; /* Space for bottom nav */
        }
        /* Top Navbar (Facebook Style) */
        .top-navbar {
            background-color: #242526;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .top-icons {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }
        .icon-btn:hover {
            background-color: #4e4f50;
        }

        /* Bottom Navbar (Facebook Style) */
        .bottom-navbar {
            background-color: #242526;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #393a3b;
            z-index: 1000;
        }
        .nav-tab {
            background: none;
            border: none;
            color: #b0b3b8;
            font-size: 22px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-tab.active {
            color: #2d88ff;
            border-bottom: 3px solid #2d88ff;
        }

        .container {
            max-width: 600px;
            margin: 15px auto;
            padding: 0 10px;
        }

        /* Stories Section */
        .stories-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .stories-container::-webkit-scrollbar {
            display: none;
        }
        .story-card {
            min-width: 110px;
            height: 180px;
            background: #242526;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8px;
            cursor: pointer;
            border: 1px solid #393a3b;
        }
        .story-card.create-story {
            justify-content: center;
            align-items: center;
            background: #242526;
        }
        .story-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-user {
            position: relative;
            z-index: 2;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Create Post Box */
        .create-post {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .create-post textarea {
            width: 100%;
            background: #3a3b3c;
            border: none;
            border-radius: 6px;
            color: white;
            padding: 12px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        .post-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .btn-upload {
            border: 2px solid #3a3b3c;
            color: #b0b3b8;
            background-color: #3a3b3c;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-name {
            font-size: 12px;
            color: #b0b3b8;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .submit-post {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        .submit-post:hover {
            background-color: #1a6fd8;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* Post Card */
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-media-container {
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #3a3b3c;
            position: relative;
        }
        .post-media {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: contain;
        }
        .download-media-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .download-media-btn:hover {
            background-color: rgba(45, 136, 255, 0.9);
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #393a3b;
            padding-bottom: 8px;
        }
        .post-actions {
            display: flex;
            justify-content: space-around;
            padding: 5px 0;
            border-bottom: 1px solid #393a3b;
            margin-bottom: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #b0b3b8;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .action-btn:hover {
            color: #2d88ff;
        }
        .comments-section {
            margin-top: 10px;
        }
        .comment-card {
            background: #3a3b3c;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .comment-header {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 3px;
        }
        .comment-text {
            color: #e4e6eb;
            word-break: break-word;
        }
        .comment-input-container {
            display: flex;
            margin-top: 8px;
            gap: 5px;
        }
        .comment-input {
            flex: 1;
            background: #3a3b3c;
            border: 1px solid #4e4f50;
            border-radius: 4px;
            color: white;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }
        .comment-btn {
            background: #2d88ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .feed-section {
            background: #242526;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #b0b3b8;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="top-navbar">
        <div class="nav-logo" onclick="window.location.reload()">SocialVibe</div>
        <div class="top-icons">
            <button class="icon-btn" onclick="goToProfile()" title="Profile">👤</button>
            <button class="icon-btn" onclick="logout()" title="Logout" style="color: #f44336;">🚪</button>
        </div>
    </div>

    <div class="container">
        <!-- Stories Row -->
        <div class="stories-container">
            <div class="story-card create-story" onclick="alert('Story feature coming soon!')">
                <span style="font-size: 24px; color: #2d88ff; font-weight: bold;">+</span>
                <span class="story-user" style="color: #e4e6eb; margin-top: 5px;">Create story</span>
            </div>
            <div class="story-card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Story">
                <span class="story-user">Tanvir Ahmed</span>
            </div>
            <div class="story-card">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Story">
                <span class="story-user">Sumaiya Akter</span>
            </div>
        </div>

        <!-- Create Post Box -->
        <div class="create-post clearfix">
            <textarea id="post-text" rows="3" placeholder="What's on your mind?"></textarea>
            
            <div class="post-options">
                <div class="upload-btn-wrapper">
                    <button class="btn-upload">📸 Photo/Video</button>
                    <input type="file" id="media-file" accept="image/*,video/*" onchange="previewMedia()">
                </div>
                <span id="file-name" class="file-name">No file chosen</span>
            </div>
            
            <div style="margin-top: 10px;" class="clearfix">
                 <button onclick="createPost()" class="submit-post">Post</button>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="posts-container">
            <div class="feed-section">Loading posts...</div>
        </div>
    </div>

    <!-- Bottom Facebook-Style Navbar -->
    <div class="bottom-navbar">
        <button class="nav-tab active" onclick="window.location.reload()" title="Home">🏠</button>
        <button class="nav-tab" onclick="alert('Videos feed coming soon!')" title="Videos">▶️</button>
        <button class="nav-tab" onclick="alert('Friends feature coming soon!')" title="Friends">👥</button>
        <button class="nav-tab" onclick="alert('No new notifications')" title="Notifications">🔔</button>
        <button class="nav-tab" onclick="goToProfile()" title="Profile & Settings">☰</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.appspot.com",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadPostsRealtime();
        };

        function goToProfile() {
            window.location.href = "profile.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function previewMedia() {
            const fileInput = document.getElementById('media-file');
            const fileNameSpan = document.getElementById('file-name');
            if (fileInput.files.length > 0) {
                fileNameSpan.textContent = fileInput.files[0].name;
            } else {
                fileNameSpan.textContent = "No file chosen";
            }
        }

        function createPost() {
            const content = document.getElementById("post-text").value.trim();
            const mediaFile = document.getElementById("media-file").files[0];
            
            if (!content && !mediaFile) {
                alert("দয়া করে কিছু লিখে বা মিডিয়া সিলেক্ট করে পোস্ট করুন!");
                return;
            }

            if (mediaFile) {
                const storageRef = storage.ref();
                const mediaRef = storageRef.child('post_media/' + Date.now() + '_' + mediaFile.name);
                
                mediaRef.put(mediaFile).then((snapshot) => {
                    snapshot.ref.getDownloadURL().then((downloadURL) => {
                        let mediaType = mediaFile.type.startsWith('video') ? 'video' : 'image';
                        savePostToFirestore(content, downloadURL, mediaType);
                    });
                }).catch((error) => {
                    alert("ফাইল আপলোড করতে সমস্যা হয়েছে: " + error.message);
                });
            } else {
                savePostToFirestore(content, null, null);
            }
        }

        function savePostToFirestore(content, mediaUrl, mediaType) {
            const now = new Date();
            const timeString = now.toLocaleDateString() + " at " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.collection("posts").add({
                author: currentUser,
                content: content,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                createdAt: timeString,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                likes: [],
                comments: []
            })
            .then(() => {
                document.getElementById("post-text").value = "";
                document.getElementById("media-file").value = "";
                document.getElementById("file-name").textContent = "No file chosen";
            })
            .catch((error) => {
                alert("পোস্ট সেভ করতে সমস্যা হয়েছে: " + error.message);
            });
        }

        function loadPostsRealtime() {
            const container = document.getElementById("posts-container");

            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <h3>Welcome to SocialVibe!</h3>
                            <p>আপনার পেজে এই মুহূর্তে কোনো পোস্ট নেই। উপরের বক্স থেকে আপনার স্ট্যাটাস শেয়ার করুন!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let postId = doc.id;
                    
                    let deleteBtn = "";
                    if (post.author === currentUser) {
                        let safePostId = "'" + postId + "'";
                        deleteBtn = `<button onclick="deletePost(${safePostId})" style="background:none; border:none; color:#f44336; float:right; cursor:pointer; font-weight:bold;">Delete</button>`;
                    }

                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        let fileExt = post.mediaType === 'video' ? 'mp4' : 'jpg';
                        let fileName = `SocialVibe_${Date.now()}.${fileExt}`;

                        if (post.mediaType === 'video') {
                            mediaHtml = `
                                <div class="post-media-container">
                                    <video src="${post.mediaUrl}" class="post-media" controls></video>
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        } else {
                            mediaHtml = `
                                <div class="post-media-container">
                                    <img src="${post.mediaUrl}" alt="Post Image" class="post-media">
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        }
                    }

                    let likes = post.likes || [];
                    let isLiked = likes.includes(currentUser);
                    let likeBtnColor = isLiked ? "#2d88ff" : "#b0b3b8";
                    let likeText = isLiked ? "Liked (" + likes.length + ")" : "Like (" + likes.length + ")";

                    let comments = post.comments || [];
                    let commentsHtml = "";
                    comments.forEach((c) => {
                        commentsHtml += `
                            <div class="comment-card">
                                <div class="comment-header">@${c.user}</div>
                                <div class="comment-text">${c.text}</div>
                            </div>
                        `;
                    });

                    let safeId = "'" + postId + "'";

                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author || 'Anonymous'} ${deleteBtn}</div>
                            <div class="post-content">${post.content}</div>
                            ${mediaHtml}
                            <div class="post-time">${post.createdAt || ''}</div>
                            
                            <div class="post-actions">
                                <button class="action-btn" style="color: ${likeBtnColor};" onclick="toggleLike(${safeId})">👍 ${likeText}</button>
                                <button class="action-btn">💬 Comments (${comments.length})</button>
                            </div>

                            <div class="comments-section">
                                ${commentsHtml}
                                <div class="comment-input-container">
                                    <input type="text" id="comment-input-${postId}" class="comment-input" placeholder="Write a comment...">
                                    <button class="comment-btn" onclick="addComment(${safeId})">Send</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function downloadFile(fileUrl, fileName) {
            fetch(fileUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    window.open(fileUrl, '_blank');
                });
        }

        function toggleLike(postId) {
            const postRef = db.collection("posts").doc(postId);
            db.runTransaction((transaction) => {
                return transaction.get(postRef).then((doc) => {
                    if (!doc.exists) throw "Post does not exist!";
                    let postData = doc.data();
                    let likes = postData.likes || [];
                    
                    if (likes.includes(currentUser)) {
                        likes = likes.filter(user => user !== currentUser);
                    } else {
                        likes.push(currentUser);
                    }
                    transaction.update(postRef, { likes: likes });
                });
            }).catch((error) => {
                console.log("Like error: ", error);
            });
        }

        function addComment(postId) {
            const inputField = document.getElementById(`comment-input-${postId}`);
            const commentText = inputField.value.trim();
            if (!commentText) return;

            const postRef = db.collection("posts").doc(postId);
            db.runTransaction((transaction) => {
                return transaction.get(postRef).then((doc) => {
                    if (!doc.exists) throw "Post does not exist!";
                    let postData = doc.data();
                    let comments = postData.comments || [];
                    
                    comments.push({
                        user: currentUser,
                        text: commentText
                    });

                    transaction.update(postRef, { comments: comments });
                });
            }).then(() => {
                inputField.value = "";
            }).catch((error) => {
                console.log("Comment error: ", error);
            });
        }

        function deletePost(postId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                db.collection("posts").doc(postId).delete().catch((error) => {
                    alert("পোস্ট ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
