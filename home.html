<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Home Feed</title>
    <!-- Firebase App & Firestore & Storage CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
        }
        .navbar {
            background-color: #242526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover {
            background-color: #4e4f50;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .create-post {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .create-post textarea {
            width: 100%;
            background: #3a3b3c;
            border: none;
            border-radius: 6px;
            color: white;
            padding: 12px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        .post-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .btn-upload {
            border: 2px solid #3a3b3c;
            color: #b0b3b8;
            background-color: #3a3b3c;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-name {
            font-size: 12px;
            color: #b0b3b8;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .create-post button.submit-post {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        .create-post button:hover {
            background-color: #1a6fd8;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-media-container {
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #3a3b3c;
            display: none;
        }
        .post-media {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: contain;
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #393a3b;
            padding-bottom: 8px;
        }
        .feed-section {
            background: #242526;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #b0b3b8;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo" onclick="window.location.reload()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToProfile()">Profile</button>
            <button class="nav-btn" onclick="logout()" style="background-color: #d32f2f;">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="create-post clearfix">
            <textarea id="post-text" rows="3" placeholder="What's on your mind?"></textarea>
            
            <div class="post-options">
                <div class="upload-btn-wrapper">
                    <button class="btn-upload">📸 Photo</button>
                    <input type="file" id="media-file" accept="image/*,video/*" onchange="previewMedia()">
                </div>
                <span id="file-name" class="file-name">No media chosen</span>
            </div>
            
            <div style="margin-top: 10px;">
                 <button onclick="createPost()" class="submit-post">Post</button>
            </div>
        </div>

        <div id="posts-container">
            <div class="feed-section">Loading posts...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.appspot.com",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadPostsRealtime();
        };

        function goToProfile() {
            window.location.href = "profile.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function previewMedia() {
            const fileInput = document.getElementById('media-file');
            const fileNameSpan = document.getElementById('file-name');
            if (fileInput.files.length > 0) {
                fileNameSpan.textContent = fileInput.files[0].name;
            } else {
                fileNameSpan.textContent = "No media chosen";
            }
        }

        function createPost() {
            const content = document.getElementById("post-text").value.trim();
            const mediaFile = document.getElementById("media-file").files[0];
            
            if (!content && !mediaFile) {
                alert("দয়া করে কিছু লিখে বা ছবি/ভিডিও সিলেক্ট করে পোস্ট করুন!");
                return;
            }

            if (mediaFile) {
                const storageRef = storage.ref();
                const mediaRef = storageRef.child('post_media/' + Date.now() + '_' + mediaFile.name);
                
                mediaRef.put(mediaFile).then((snapshot) => {
                    snapshot.ref.getDownloadURL().then((downloadURL) => {
                        let mediaType = mediaFile.type.startsWith('video') ? 'video' : 'image';
                        savePostToFirestore(content, downloadURL, mediaType);
                    });
                }).catch((error) => {
                    alert("ফাইল আপলোড করতে সমস্যা হয়েছে: " + error.message);
                });
            } else {
                savePostToFirestore(content, null, null);
            }
        }

        function savePostToFirestore(content, mediaUrl, mediaType) {
            const now = new Date();
            const timeString = now.toLocaleDateString() + " at " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.collection("posts").add({
                author: currentUser,
                content: content,
                mediaUrl: mediaUrl,
                mediaType: mediaType, // 'image' or 'video'
                createdAt: timeString,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                document.getElementById("post-text").value = "";
                document.getElementById("media-file").value = "";
                document.getElementById("file-name").textContent = "No media chosen";
            })
            .catch((error) => {
                alert("পোস্ট সেভ করতে সমস্যা হয়েছে: " + error.message);
            });
        }

        function loadPostsRealtime() {
            const container = document.getElementById("posts-container");

            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <h3>Welcome to SocialVibe!</h3>
                            <p>আপনার পেজে এই মুহূর্তে কোনো পোস্ট নেই। প্রথম পোস্ট বা ভিডিও শেয়ার করুন!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let postId = doc.id;
                    
                    let deleteBtn = "";
                    if (post.author === currentUser) {
                        let safePostId = "'" + postId + "'";
                        deleteBtn = `<button onclick="deletePost(${safePostId})" style="background:none; border:none; color:#f44336; float:right; cursor:pointer; font-weight:bold;">Delete</button>`;
                    }

                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        if (post.mediaType === 'video') {
                            mediaHtml = `
                                <div class="post-media-container" style="display: block;">
                                    <video src="${post.mediaUrl}" class="post-media" controls></video>
                                </div>
                            `;
                        } else {
                            mediaHtml = `
                                <div class="post-media-container" style="display: block;">
                                    <img src="${post.mediaUrl}" alt="Post Image" class="post-media">
                                </div>
                            `;
                        }
                    }

                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author || 'Anonymous'} ${deleteBtn}</div>
                            <div class="post-content">${post.content}</div>
                            ${mediaHtml}
                            <div class="post-time">${post.createdAt || ''}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function deletePost(postId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                db.collection("posts").doc(postId).delete().catch((error) => {
                    alert("পোস্ট ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
