<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Home</title>
    <!-- Firebase App & Firestore CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
        }
        /* Top Navigation Bar */
        .navbar {
            background-color: #242526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
        }
        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover {
            background-color: #4e4f50;
        }
        .logout-btn {
            background-color: #d93838;
        }
        .logout-btn:hover {
            background-color: #b52b2b;
        }

        /* Main Feed Container */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* Create Post Box */
        .post-create-box {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .post-create-box textarea {
            width: 100%;
            background: #3a3b3c;
            border: none;
            border-radius: 20px;
            padding: 12px 15px;
            color: white;
            resize: none;
            box-sizing: border-box;
            height: 60px;
            font-size: 15px;
        }
        .post-create-box button {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
            margin-top: 10px;
            font-weight: bold;
        }
        .post-create-box button:hover {
            background-color: #1a6fd8;
        }

        /* Post Card Style */
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
        }

        /* Welcome Section */
        .feed-section {
            background: #242526;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="nav-logo">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToProfile()">Profile</button>
            <button class="nav-btn logout-btn" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Status / Post Box -->
        <div class="post-create-box clearfix">
            <textarea id="post-text" placeholder="What's on your mind?"></textarea>
            <button onclick="createPost()">Post</button>
        </div>

        <!-- News Feed / Posts Container -->
        <div id="posts-container">
            <div class="feed-section">Loading posts...</div>
        </div>

    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.firebasestorage.app",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // লগইন চেক করা
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        // পেজ লোড হলেই ফায়ারবেস থেকে রিয়েল-টাইম পোস্ট লোড করা
        window.onload = function() {
            loadPostsRealtime();
        };

        // প্রোফাইল পেজে যাওয়ার ফাংশন
        function goToProfile() {
            window.location.href = "profile.html";
        }

        // ফায়ারবেসে পোস্ট সেভ করার ফাংশন
        function createPost() {
            const postText = document.getElementById("post-text").value.trim();
            if(!postText) {
                alert("দয়া করে কিছু লিখে তারপর পোস্ট করুন!");
                return;
            }

            db.collection("posts").add({
                author: currentUser,
                content: postText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: new Date().toLocaleString()
            })
            .then(() => {
                document.getElementById("post-text").value = "";
            })
            .catch((error) => {
                alert("পোস্ট করতে সমস্যা হয়েছে: " + error.message);
            });
        }

        // ফায়ারবেস থেকে লাইভ পোস্ট ফেচ বা লোড করার ফাংশন
        function loadPostsRealtime() {
            const container = document.getElementById("posts-container");

            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <h3>Welcome to SocialVibe!</h3>
                            <p>আপনার পেজে এই মুহূর্তে কোনো পোস্ট নেই। উপরের বক্সে কিছু লিখে আপনার প্রথম পোস্টটি শেয়ার করুন!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author || 'Anonymous'}</div>
                            <div class="post-content">${post.content}</div>
                            <div class="post-time">${post.createdAt || ''}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        // লগআউট ফাংশন
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
