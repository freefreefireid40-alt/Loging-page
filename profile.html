<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Profile</title>
    <!-- Firebase App & Firestore & Storage CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #18191a;
            font-family: Arial, sans-serif;
            color: #e4e6eb;
        }
        .navbar {
            background-color: #242526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #393a3b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 24px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: #3a3b3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover {
            background-color: #4e4f50;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .profile-header {
            background: #242526;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            background-color: #2d88ff;
            color: white;
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #e4e6eb;
            margin-bottom: 5px;
        }
        .profile-bio {
            font-size: 14px;
            color: #b0b3b8;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d88ff;
        }
        .post-card {
            background: #242526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-media-container {
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #3a3b3c;
            position: relative;
        }
        .post-media {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: contain;
        }
        .download-media-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .download-media-btn:hover {
            background-color: rgba(45, 136, 255, 0.9);
        }
        .post-time {
            font-size: 12px;
            color: #b0b3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #393a3b;
            padding-bottom: 8px;
        }
        .feed-section {
            background: #242526;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #b0b3b8;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo" onclick="goToHome()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToHome()">Home</button>
            <button class="nav-btn" onclick="logout()" style="background-color: #d32f2f;">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="profile-header">
            <div id="profile-avatar" class="profile-avatar">U</div>
            <div id="profile-name" class="profile-name">@User</div>
            <div class="profile-bio">SocialVibe Active Member</div>
        </div>

        <div class="section-title">My Posts & Status</div>
        <div id="user-posts-container">
            <div class="feed-section">Loading your posts...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.appspot.com",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        document.getElementById("profile-name").textContent = "@" + currentUser;
        document.getElementById("profile-avatar").textContent = currentUser.charAt(0).toUpperCase();

        window.onload = function() {
            loadUserPosts();
        };

        function goToHome() {
            window.location.href = "home.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function loadUserPosts() {
            const container = document.getElementById("user-posts-container");

            db.collection("posts").where("author", "==", currentUser).orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <p>আপনার এই মুহূর্তে কোনো পোস্ট বা স্ট্যাটাস নেই!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let postId = doc.id;
                    let safePostId = "'" + postId + "'";
                    let deleteBtn = `<button onclick="deletePost(${safePostId})" style="background:none; border:none; color:#f44336; float:right; cursor:pointer; font-weight:bold;">Delete</button>`;

                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        let fileExt = post.mediaType === 'video' ? 'mp4' : 'jpg';
                        let fileName = `SocialVibe_${Date.now()}.${fileExt}`;

                        if (post.mediaType === 'video') {
                            mediaHtml = `
                                <div class="post-media-container" style="display: block;">
                                    <video src="${post.mediaUrl}" class="post-media" controls></video>
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        } else {
                            mediaHtml = `
                                <div class="post-media-container" style="display: block;">
                                    <img src="${post.mediaUrl}" alt="Post Image" class="post-media">
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        }
                    }

                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author} ${deleteBtn}</div>
                            <div class="post-content">${post.content}</div>
                            ${mediaHtml}
                            <div class="post-time">${post.createdAt || ''}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function downloadFile(fileUrl, fileName) {
            fetch(fileUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    window.open(fileUrl, '_blank');
                });
        }

        function deletePost(postId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                db.collection("posts").doc(postId).delete().catch((error) => {
                    alert("পোস্ট ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
