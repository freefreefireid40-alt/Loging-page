<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialVibe - Profile</title>
    <meta name="manifest" href="manifest.json">
    <!-- Firebase App & Firestore & Storage CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1012;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e4e6eb;
        }
        .navbar {
            background-color: #1a1b1e;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2d30;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-size: 22px;
            font-weight: bold;
            color: #2d88ff;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background-color: #2c2d30;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .nav-btn:hover {
            background-color: #3a3b3e;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        
        /* Facebook Style Profile Header */
        .profile-cover-section {
            background-color: #1a1b1e;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .cover-photo {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            position: relative;
        }
        .profile-info-container {
            padding: 0 20px 20px 20px;
            text-align: center;
            position: relative;
        }
        .profile-avatar-wrapper {
            width: 140px;
            height: 140px;
            margin: -75px auto 10px auto;
            border-radius: 50%;
            border: 4px solid #1a1b1e;
            background-color: #2d88ff;
            color: white;
            font-size: 55px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .profile-name {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .profile-username {
            font-size: 14px;
            color: #8a8d91;
            margin-bottom: 8px;
        }
        .profile-bio {
            font-size: 15px;
            color: #b0b3b8;
            margin-bottom: 15px;
            padding: 0 20px;
        }
        
        /* Edit Profile / Action Buttons */
        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-primary-fb {
            background-color: #2d88ff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary-fb {
            background-color: #3a3b3e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* Edit Form Modal/Box */
        .edit-box {
            background: #242528;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 20px;
            text-align: left;
            display: none;
            border: 1px solid #3a3b3e;
        }
        .edit-box input, .edit-box textarea {
            width: 100%;
            background: #1a1b1e;
            border: 1px solid #3a3b3e;
            border-radius: 5px;
            color: white;
            padding: 8px 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .edit-box label {
            font-size: 12px;
            color: #8a8d91;
            font-weight: bold;
        }

        /* Intro / At a Glance Section */
        .intro-section {
            background: #1a1b1e;
            margin: 0 10px 15px 10px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .intro-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .intro-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #b0b3b8;
            margin-bottom: 8px;
        }

        /* Profile Tabs */
        .profile-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid #2c2d30;
            padding-top: 12px;
            margin-top: 10px;
        }
        .tab-item {
            color: #b0b3b8;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            padding: 5px 10px;
        }
        .tab-item.active {
            color: #2d88ff;
            border-bottom: 3px solid #2d88ff;
        }

        /* Post Area */
        .content-area {
            padding: 0 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d88ff;
            padding-left: 5px;
        }
        .post-card {
            background: #1a1b1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            border: 1px solid #2c2d30;
        }
        .post-author {
            font-weight: bold;
            color: #2d88ff;
            margin-bottom: 8px;
        }
        .post-content {
            color: #e4e6eb;
            font-size: 15px;
            word-break: break-word;
            margin-bottom: 10px;
        }
        .post-media-container {
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #2c2d30;
            position: relative;
        }
        .post-media {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: contain;
        }
        .download-media-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .post-time {
            font-size: 12px;
            color: #8a8d91;
            margin-bottom: 10px;
            border-bottom: 1px solid #2c2d30;
            padding-bottom: 8px;
        }
        .feed-section {
            background: #1a1b1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #8a8d91;
            margin-bottom: 20px;
            border: 1px solid #2c2d30;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo" onclick="goToHome()">SocialVibe</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goToHome()">Home Feed</button>
            <button class="nav-btn" onclick="logout()" style="background-color: #a82222;">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Cover Photo & Profile Header -->
        <div class="profile-cover-section">
            <div class="cover-photo"></div>
            <div class="profile-info-container">
                <div id="profile-avatar" class="profile-avatar-wrapper">U</div>
                <div id="display-name" class="profile-name">User Name</div>
                <div id="display-username" class="profile-username">@username</div>
                <div id="display-bio" class="profile-bio">Welcome to my SocialVibe profile!</div>
                
                <div class="profile-actions">
                    <button class="btn-primary-fb" onclick="toggleEditBox()">✏️ Edit Profile</button>
                </div>

                <!-- Edit Profile Hidden Box -->
                <div id="edit-profile-box" class="edit-box">
                    <label>Full Name:</label>
                    <input type="text" id="input-name" placeholder="Enter your name">
                    
                    <label>Username:</label>
                    <input type="text" id="input-username" placeholder="Enter username">
                    
                    <label>Bio:</label>
                    <textarea id="input-bio" rows="2" placeholder="Write something about yourself..."></textarea>
                    
                    <label>Lives In (Location):</label>
                    <input type="text" id="input-location" placeholder="e.g. Kishoreganj, Dhaka">
                    
                    <label>Relationship Status:</label>
                    <input type="text" id="input-relation" placeholder="e.g. Single / Married">
                    
                    <button class="btn-primary-fb" onclick="saveProfileData()">Save Changes</button>
                </div>

                <!-- Facebook Style Intro Section -->
                <div class="intro-section">
                    <div class="intro-title">At a Glance</div>
                    <div class="intro-item">📍 <span id="info-location">Lives in Bangladesh</span></div>
                    <div class="intro-item">❤️ <span id="info-relation">SocialVibe Member</span></div>
                </div>

                <div class="profile-tabs">
                    <div class="tab-item active">Posts</div>
                    <div class="tab-item" onclick="alert('Photos tab feature!')">Photos</div>
                    <div class="tab-item" onclick="alert('Videos tab feature!')">Videos</div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="section-title">My Posts & Status</div>
            <div id="user-posts-container">
                <div class="feed-section">Loading your posts...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_44EQtMe4dZhNtKBo2YYKMpsUXKvOtdc",
            authDomain: "socialvibe-b0abb.firebaseapp.com",
            projectId: "socialvibe-b0abb",
            storageBucket: "socialvibe-b0abb.appspot.com",
            messagingSenderId: "1086874408492",
            appId: "1:1086874408492:web:fdc1dd705b820d62c42389",
            measurementId: "G-E5399L9T5T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
            alert("দয়া করে আগে লগইন করুন!");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadUserProfile();
            loadUserPosts();
        };

        function goToHome() {
            window.location.href = "home.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function toggleEditBox() {
            const box = document.getElementById("edit-profile-box");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        function loadUserProfile() {
            db.collection("users").doc(currentUser).get().then((doc) => {
                let name = currentUser;
                let username = "@" + currentUser;
                let bio = "SocialVibe Active Member";
                let location = "Bangladesh";
                let relation = "Single";

                if (doc.exists) {
                    let data = doc.data();
                    if (data.name) name = data.name;
                    if (data.username) username = "@" + data.username;
                    if (data.bio) bio = data.bio;
                    if (data.location) location = data.location;
                    if (data.relation) relation = data.relation;
                }

                document.getElementById("display-name").textContent = name;
                document.getElementById("display-username").textContent = username;
                document.getElementById("display-bio").textContent = bio;
                document.getElementById("profile-avatar").textContent = name.charAt(0).toUpperCase();
                
                document.getElementById("info-location").textContent = "Lives in " + location;
                document.getElementById("info-relation").textContent = relation;

                // Fill inputs
                document.getElementById("input-name").value = name;
                document.getElementById("input-username").value = username.replace("@", "");
                document.getElementById("input-bio").value = bio;
                document.getElementById("input-location").value = location;
                document.getElementById("input-relation").value = relation;
            }).catch((error) => {
                console.log("Error loading user profile:", error);
            });
        }

        function saveProfileData() {
            const newName = document.getElementById("input-name").value.trim();
            const newUsername = document.getElementById("input-username").value.trim();
            const newBio = document.getElementById("input-bio").value.trim();
            const newLocation = document.getElementById("input-location").value.trim();
            const newRelation = document.getElementById("input-relation").value.trim();

            db.collection("users").doc(currentUser).set({
                name: newName,
                username: newUsername,
                bio: newBio,
                location: newLocation,
                relation: newRelation
            }, { merge: true }).then(() => {
                alert("প্রোফাইল সফলভাবে আপডেট করা হয়েছে!");
                toggleEditBox();
                loadUserProfile();
            }).catch((error) => {
                alert("প্রোফাইল আপডেট করতে সমস্যা হয়েছে: " + error.message);
            });
        }

        function loadUserPosts() {
            const container = document.getElementById("user-posts-container");

            db.collection("posts").where("author", "==", currentUser).orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="feed-section">
                            <p>আপনার এই মুহূর্তে কোনো পোস্ট বা স্ট্যাটাস নেই!</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                snapshot.forEach((doc) => {
                    let post = doc.data();
                    let postId = doc.id;
                    let safePostId = "'" + postId + "'";
                    let deleteBtn = `<button onclick="deletePost(${safePostId})" style="background:none; border:none; color:#f44336; float:right; cursor:pointer; font-weight:bold;">Delete</button>`;

                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        let fileExt = post.mediaType === 'video' ? 'mp4' : 'jpg';
                        let fileName = `SocialVibe_${Date.now()}.${fileExt}`;

                        if (post.mediaType === 'video') {
                            mediaHtml = `
                                <div class="post-media-container">
                                    <video src="${post.mediaUrl}" class="post-media" controls></video>
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        } else {
                            mediaHtml = `
                                <div class="post-media-container">
                                    <img src="${post.mediaUrl}" alt="Post Image" class="post-media">
                                    <button class="download-media-btn" onclick="downloadFile('${post.mediaUrl}', '${fileName}')">📥 Save to Gallery</button>
                                </div>`;
                        }
                    }

                    html += `
                        <div class="post-card">
                            <div class="post-author">@${post.author} ${deleteBtn}</div>
                            <div class="post-content">${post.content}</div>
                            ${mediaHtml}
                            <div class="post-time">${post.createdAt || ''}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            });
        }

        function downloadFile(fileUrl, fileName) {
            fetch(fileUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    window.open(fileUrl, '_blank');
                });
        }

        function deletePost(postId) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                db.collection("posts").doc(postId).delete().catch((error) => {
                    alert("পোস্ট ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
